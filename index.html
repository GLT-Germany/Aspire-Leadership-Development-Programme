<!DOCTYPE html><html><head><meta charset='utf-8'><title>Aspire Leadership Development Programme</title><script src='https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js'></script><style>body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#FAFAF7;margin:0;padding:24px}.card{background:#fff;border:1px solid #d5d2c7;border-radius:8px;padding:16px;margin:12px 0}.hidden{display:none}button{padding:8px 12px}#gate{max-width:420px;margin:80px auto}.kpi{font-size:32px;font-weight:700}</style></head><body><div id='gate' class='card'><h2>Aspire Dashboard</h2><input id='pw' type='password'><button onclick='unlock()'>Unlock</button><div id='err'></div></div><div id='app' class='hidden'><div class='card'><h1>Aspire Leadership Development Programme</h1><p>Password-protected survey dashboard</p></div><div class='card'><div class='kpi' id='resp'></div><div>Total respondents</div></div><div class='card'><canvas id='c'></canvas></div></div><script>const PASS='aGVsbG8hMTIz';function unlock(){if(btoa(document.getElementById('pw').value)===PASS){sessionStorage.a=1;gate.style.display='none';app.classList.remove('hidden')}else err.textContent='Incorrect password';}if(sessionStorage.a){gate.style.display='none';app.classList.remove('hidden')}const total=66;document.getElementById('resp').textContent=total;new Chart(document.getElementById('c'),{type:'bar',data:{labels:['Relevance','Preparedness','Faculty','Facilitation','Location'],datasets:[{data:[4.5,4.5,4.7,4.7,4.5]}]}});</script></body></html>
